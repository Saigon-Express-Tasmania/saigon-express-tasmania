<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>pageshow / popstate test</title>
  <style>
    body { font-family: monospace; padding: 2rem; background: #111; color: #eee; }
    h1 { color: #f90; margin-bottom: 0.5rem; }
    p { color: #aaa; margin-bottom: 1.5rem; }
    #log { list-style: none; padding: 0; }
    #log li {
      padding: 0.4rem 0.8rem;
      margin-bottom: 0.3rem;
      border-left: 3px solid #555;
      background: #1e1e1e;
    }
    #log li.pageshow  { border-color: #4af; }
    #log li.popstate  { border-color: #fa4; }
    #log li.initial   { border-color: #8f8; }
    .time { color: #888; margin-right: 0.6rem; }
    .label { font-weight: bold; margin-right: 0.5rem; }
    a { color: #4af; }
    .links { margin-bottom: 1.5rem; display: flex; gap: 1rem; }
    button { cursor: pointer; padding: 0.4rem 1rem; background: #333; color: #eee; border: 1px solid #555; border-radius: 4px; }
    button:hover { background: #444; }
  </style>
</head>
<body>
  <h1>pageshow / popstate experiment</h1>
  <p>
    Navigate between pages using the links below, then use the browser's <strong>Back</strong>
    and <strong>Forward</strong> buttons and watch the log.
  </p>

  <div class="links">
    <a href="pageshow-test.html">This page (reload)</a>
    <a href="pageshow-test-b.html">Page B (must exist)</a>
    <button onclick="history.pushState({page:'pushed'}, '', '?pushed=1')">pushState → ?pushed=1</button>
    <button onclick="history.back()">history.back()</button>
    <button onclick="history.forward()">history.forward()</button>
    <button onclick="document.getElementById('log').innerHTML=''">Clear log</button>
  </div>

  <ul id="log"></ul>

  <script>
    const logEl = document.getElementById('log');

    function addEntry(type, detail) {
      const li = document.createElement('li');
      li.className = type;
      const time = new Date().toLocaleTimeString('en-AU', { hour12: false, fractionalSecondDigits: 3 });
      li.innerHTML =
        '<span class="time">' + time + '</span>' +
        '<span class="label">[' + type.toUpperCase() + ']</span>' +
        detail;
      logEl.prepend(li);
    }

    window.addEventListener('pageshow', function(e) {
      addEntry(
        'pageshow',
        'persisted=' + e.persisted +
        ' | url=' + location.href +
        (e.persisted ? ' <strong style="color:#4af">← bfcache restore</strong>' : '')
      );
    });

    window.addEventListener('popstate', function(e) {
      addEntry(
        'popstate',
        'state=' + JSON.stringify(e.state) +
        ' | url=' + location.href
      );
    });

    // Show what fired on initial script execution (before any events)
    addEntry('initial', 'Script ran — url=' + location.href);
  </script>
</body>
</html>
