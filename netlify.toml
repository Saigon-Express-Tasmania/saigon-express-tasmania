# Main public site (Next.js).
# publish must be ".next" for @netlify/plugin-nextjs v5.
# In the Netlify UI: Build settings → set "Publish directory" to empty and enable
# "Use netlify.toml" (do not override with a UI-only publish path).
[build]
  command = "npm run build:netlify"
  publish = ".next"

# Also set APP_URL, DEFAULT_LOCALE, SUPPORTED_LOCALES, and NEXT_PUBLIC_* in the Netlify UI
# (Site configuration → Environment variables) for Git-based builds.
[build.environment]
  NEXT_DISABLE_NETLIFY_EDGE = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"
